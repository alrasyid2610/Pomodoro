<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Pomodoro</h1>

    <nav class="modes" role="tablist">
      <button data-mode="focus" class="active">Fokus</button>
      <button data-mode="short">Istirahat Pendek</button>
      <button data-mode="long">Istirahat Panjang</button>
    </nav>

    <div id="time" class="time" aria-live="polite">25:00</div>

    <div class="controls">
      <button id="start" class="primary">Mulai</button>
      <button id="reset">Reset</button>
      <button id="skip">Lewati</button>
    </div>

    <p class="counter">Sesi fokus selesai: <span id="count">0</span></p>

    <section class="extras">
      <label>Tema
        <select id="theme">
          <option value="none">Polos</option>
          <option value="mountain">Gunung</option>
          <option value="abstract">Abstrak</option>
        </select>
      </label>
      <div class="sound">
        <button id="sound-toggle" aria-pressed="false">🔇 Musik fokus</button>
        <input type="range" id="volume" min="0" max="100" value="40" aria-label="Volume">
      </div>
    </section>

    <details class="settings">
      <summary>Pengaturan (menit)</summary>
      <label>Fokus <input type="number" id="set-focus" min="1" max="120" value="25"></label>
      <label>Istirahat pendek <input type="number" id="set-short" min="1" max="60" value="5"></label>
      <label>Istirahat panjang <input type="number" id="set-long" min="1" max="60" value="15"></label>
      <label>Istirahat panjang tiap <input type="number" id="set-interval" min="2" max="10" value="4"> sesi</label>
    </details>
  </main>
  <audio id="bgm" src="assets/audio/calm-ambient.mp3" loop preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
